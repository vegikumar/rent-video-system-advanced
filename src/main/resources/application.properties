spring.application.name=rentvideo-advanced
server.port=8080

# Default profile uses H2 for easy local runs.
# Switch to MySQL with: --spring.profiles.active=mysql
spring.profiles.active=h2

# JWT configuration
app.jwt.secret=RentVideoAdvancedSecretKeyForJwtTokenGenerationMustBeLongEnough256Bits
app.jwt.expiration-ms=86400000

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
